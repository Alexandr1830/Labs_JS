<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple App</title>

    <link rel="stylesheet" href="./components/back-button/styles.css">
    <link rel="stylesheet" href="./components/product/styles.css">
    <link rel="stylesheet" href="./components/product-card/styles.css">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body>

    <div id="root"></div>

    <div id="product-page" style="display: none; flex-direction: column; align-items: center; padding: 40px; gap: 20px;">
        <h2>Добавить новую карточку</h2>
        <input type="text" id="new-title" class="form-control" placeholder="Заголовок" style="max-width: 400px;">
        <input type="text" id="new-image" class="form-control" placeholder="Ссылка на изображение" style="max-width: 400px;">
        <input type="text" id="new-text1" class="form-control" placeholder="Текст 1" style="max-width: 400px;">
        <input type="text" id="new-text2" class="form-control" placeholder="Текст 2" style="max-width: 400px;">
        <input type="text" id="new-text3" class="form-control" placeholder="Текст 3" style="max-width: 400px;">
        <input type="text" id="new-text4" class="form-control" placeholder="Текст 4" style="max-width: 400px;">
        <button id="add-new-card" class="btn btn-primary">Добавить карточку</button>
    </div>
    
    <script src="lab_6.js" type="module"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
